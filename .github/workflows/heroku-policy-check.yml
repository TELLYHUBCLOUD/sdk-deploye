name: Heroku Policy Guard Checks

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "start.sh"
      - "update.py"
      - "heroku_policy_patch.py"
      - "tests/**"
      - ".github/workflows/heroku-policy-check.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "start.sh"
      - "update.py"
      - "heroku_policy_patch.py"
      - "tests/**"
      - ".github/workflows/heroku-policy-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile update.py heroku_policy_patch.py tests/test_heroku_policy_patch.py

      - name: Check shell syntax
        run: bash -n start.sh

      - name: Test Heroku policy patcher
        run: python -m unittest discover -s tests -v
